[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pano-reframe"
version = "0.1.0"
description = "Mathematical perspective views and wall alignment for spherical panoramas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
pano-reframe = "pano_reframe.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["pano_reframe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pano_reframe --cov=scripts --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
